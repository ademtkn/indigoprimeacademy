<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin · Indigo Prime Academy</title>
  <link rel="icon" type="image/png" href="../assets/img/favicon.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&family=Manrope:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
<div id="login" class="login" hidden>
  <div class="login-card">
    <div class="lang-pick" data-lang-pick></div>
    <img src="../assets/img/logo-240.png" alt="Indigo Prime Academy" width="160">
    <h1 data-i18n="login.title"></h1>
    <p class="muted" data-i18n="login.intro"></p>
    <form class="login-form" id="login-form">
      <label for="user" data-i18n="login.user"></label>
      <input id="user" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="20" required>
      <label for="pass" data-i18n="login.pass"></label>
      <input id="pass" type="password" autocomplete="current-password" maxlength="6" required>
      <label class="check"><input type="checkbox" id="remember" checked> <span data-i18n="login.remember"></span></label>
      <button class="btn btn--primary" type="submit" data-i18n="login.submit"></button>
    </form>
    <p class="error" id="login-error" hidden></p>
    <details class="help">
      <summary data-i18n="login.owner"></summary>
      <form class="login-form" id="token-form">
        <label for="token" data-i18n="login.token"></label>
        <input id="token" type="password" autocomplete="off" placeholder="github_pat_…" required>
        <button class="btn btn--ghost" type="submit" data-i18n="login.tokenSubmit"></button>
      </form>
      <p style="margin:.8rem 0 .2rem;font-weight:700" data-i18n="login.help"></p>
      <ol>
        <li data-i18n-html="login.h1"></li>
        <li data-i18n-html="login.h2"></li>
        <li data-i18n-html="login.h3"></li>
        <li data-i18n-html="login.h4"></li>
        <li data-i18n-html="login.h5"></li>
        <li data-i18n-html="login.h6"></li>
      </ol>
      <p class="muted" data-i18n="login.hnote"></p>
    </details>
  </div>
</div>

<div id="app" class="app" hidden>
  <aside class="side">
    <div class="side-brand"><img src="../assets/img/logo-240.png" alt="" width="64"><span data-i18n-html="side.title"></span></div>
    <p class="who" id="who"></p>
    <nav class="side-nav" id="side-nav"></nav>
    <div class="side-foot">
      <div class="lang-pick lang-pick--dark" data-lang-pick></div>
      <a href="../index.html" target="_blank" rel="noopener" data-i18n="side.open"></a>
      <button type="button" class="linkish" id="logout" data-i18n="side.logout"></button>
    </div>
  </aside>
  <div class="main">
    <header class="bar">
      <button type="button" class="menu-btn" id="menu-btn" aria-label="Menu" data-i18n-aria="menu">☰</button>
      <div class="bar-status" id="status"></div>
      <div class="bar-actions">
        <button type="button" class="btn btn--ghost" id="discard" disabled data-i18n="discard"></button>
        <button type="button" class="btn btn--primary" id="save" disabled data-i18n="save"></button>
      </div>
    </header>
    <main class="view" id="view"></main>
  </div>
</div>
<div id="loading" class="loading" data-i18n="loading">…</div>
<div class="toast" id="toast" hidden></div>
<script src="config.js"></script>
<script src="i18n.js"></script>
<script src="admin.js"></script>
</body>
</html>
